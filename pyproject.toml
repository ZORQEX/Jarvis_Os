[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS WorkOS — voice-first desktop assistant core"
requires-python = ">=3.12"
dependencies = [
    "aiohttp==3.14.5",
    "playwright==1.64.0",
    "telethon==1.45.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
# fashion/ is the vendored fashion-orders app (git subtree of morph-rq/alina-fashion-ai) with its own style and tests.
extend-exclude = ["fashion"]
