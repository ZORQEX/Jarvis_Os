# JARVIS WorkOS (sourced from ~/.config/hypr/hyprland.conf by scripts/omarchy-integrate.sh; remove: … remove)
bindd = SUPER, H, JARVIS, exec, jarvis
bindd = SUPER SHIFT, H, JARVIS emergency stop, exec, jarvis stop
bindd = SUPER SHIFT, J, JARVIS companion, exec, jarvis overlay
bindd = SUPER ALT, D, JARVIS dictation, exec, jarvis dictate
# The desktop companion at login (starts the JARVIS core if it is not running).
exec-once = jarvis overlay
